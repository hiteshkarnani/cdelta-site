<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hitesh | Constellation-Delta Group</title>

  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(16, 75, 55, 0.45), transparent 45%),
        linear-gradient(135deg, #020b08, #031710 55%, #010604);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Constellation background */
    #constellation-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      position: relative;
      z-index: 2;
    }

    .card {
      width: min(440px, 100%);
      padding: 38px 30px 30px;

      background:
        linear-gradient(
          145deg,
          rgba(8, 35, 27, 0.94),
          rgba(2, 13, 10, 0.97)
        );

      border: 1px solid rgba(210, 169, 75, 0.55);
      border-radius: 18px;

      box-shadow:
        0 0 30px rgba(202, 164, 70, 0.10),
        inset 0 0 25px rgba(202, 164, 70, 0.025);

      backdrop-filter: blur(8px);
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin-bottom: 15px;

      filter:
        drop-shadow(0 0 8px rgba(214, 174, 76, 0.20));
    }

    .brand {
      color: #d6ae4c;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .group {
      color: #ffffff;
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 27px;
      opacity: 0.9;
    }

    .divider {
      width: 70px;
      height: 1px;
      background: #cfa94a;
      margin: 0 auto 25px;
      opacity: 0.7;
    }

    .name {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .role {
      color: #c9a64b;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .contact-info {
      margin-bottom: 25px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;

      margin: 13px 0;
    }

    .contact-icon {
      color: #d6ae4c;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      text-decoration: none;
      padding: 14px 10px;
      border-radius: 8px;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .btn-call {
      color: #07120e;
      background: #d6ae4c;
      border: 1px solid #d6ae4c;
    }

    .btn-email {
      color: #d6ae4c;
      background: rgba(214, 174, 76, 0.04);
      border: 1px solid rgba(214, 174, 76, 0.65);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(214, 174, 76, 0.18);
    }

    .btn-call:hover {
      background: #e1bb5d;
    }

    .btn-email:hover {
      background: rgba(214, 174, 76, 0.10);
    }

    .footer {
      margin-top: 28px;
      padding-top: 17px;
      border-top: 1px solid rgba(214, 174, 76, 0.18);

      color: rgba(255, 255, 255, 0.42);
      font-size: 9px;
      letter-spacing: 3px;
    }

    @media (max-width: 480px) {

      .page {
        padding: 15px;
      }

      .card {
        padding: 30px 22px 24px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }

      .brand {
        font-size: 17px;
        letter-spacing: 2px;
      }

      .name {
        font-size: 27px;
      }

      .contact-item {
        font-size: 14px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }

    @media (max-height: 650px) {

      .card {
        padding: 20px 25px;
      }

      .logo {
        width: 70px;
        height: 70px;
        margin-bottom: 8px;
      }

      .group {
        margin-bottom: 15px;
      }

      .divider {
        margin-bottom: 15px;
      }

      .role {
        margin-bottom: 15px;
      }

      .contact-item {
        margin: 8px 0;
      }

      .buttons {
        margin-top: 15px;
      }

      .footer {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <canvas id="constellation-canvas"></canvas>

      <h1 class="name">

      <div class="role">
        
      </div>

      <div class="contact-info">

        <div class="contact-item">

          <span>+91 9636602708</span>
        </div>

        <div class="contact-item">
          <span class="contact-icon">✉</span>

      <div class="buttons">

        <a

      </div>

      <div class="footer">
        
      </div>

    </section>

  </main>


  <script>

    /* =========================================
       CONSTELLATION BACKGROUND
       ========================================= */

    const canvas = document.getElementById("constellation-canvas");
    const ctx = canvas.getContext("2d");

    let particles = [];
    let width;
    let height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const particleCount =
      window.innerWidth < 600 ? 45 : 75;

    for (let i = 0; i < particleCount; i++) {

      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,

        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,

        size: Math.random() * 1.4 + 0.4,

        opacity: Math.random() * 0.55 + 0.15
      });

    }

    function animate() {

      ctx.clearRect(0, 0, width, height);

      for (let p of particles) {

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;

        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(214,174,76,${p.opacity})`;

        ctx.fill();
      }


      /* Connecting constellation lines */

      for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

          const a = particles[i];
          const b = particles[j];

          const dx = a.x - b.x;
          const dy = a.y - b.y;

          const distance =
            Math.sqrt(dx * dx + dy * dy);

          if (distance < 120) {

            const opacity =
              (1 - distance / 120) * 0.16;

            ctx.beginPath();

            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);

            ctx.strokeStyle =
              `rgba(214,174,76,${opacity})`;

            ctx.lineWidth = 0.5;

            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

  </script>

</body>
</html>
