<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pritesh Karnani | Cdelta</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #111827;
            --text-muted: #6b7280;
            --btn-dark: #111827;
            --btn-dark-hover: #1f2937;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Animated Gradient Background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(-45deg, #e2e8f0, #f8fafc, #cbd5e1, #f1f5f9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Entrance Animation */
        .profile-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile Photo with Pulse Effect */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 2;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #111827, #6b7280);
            z-index: 1;
            opacity: 0.15;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.08); opacity: 0.1; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        .avatar-container:hover .avatar-img {
            transform: scale(1.08) rotate(3deg);
        }

        h1 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.title {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Advanced Button Animations */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn svg {
            transition: transform 0.3s ease;
        }

        .btn-call {
            background-color: var(--btn-dark);
            color: #ffffff;
            border: 2px solid var(--btn-dark);
            box-shadow: 0 4px 14px rgba(17, 24, 39, 0.25);
        }

        .btn-call:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(17, 24, 39, 0.35);
            background-color: var(--btn-dark-hover);
        }

        .btn-call:hover svg {
            transform: scale(1.15) rotate(-5deg);
        }

        .btn-email {
            background-color: transparent;
            color: var(--btn-dark);
            border: 2px solid var(--btn-dark);
        }

        .btn-email:hover {
            transform: translateY(-3px);
            background-color: #f3f4f6;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-email:hover svg {
            transform: scale(1.15) translateY(-2px);
        }
        
        .branding {
            margin-top: 35px;
            font-size: 13px;
            color: #9ca3af;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .branding span {
            color: #4b5563;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        
        <div class="avatar-container">
            <img src="your-photo.jpg" alt="Pritesh Karnani" class="avatar-img">
        </div>
        
        <h1>Pritesh Karnani</h1>
        <p class="title">CEO & Co-Founder</p>
        
        <div class="button-group">
            
            <a href="tel:+917878734774" class="btn btn-call">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                Call Now
            </a>
            
            <a href="mailto:pritesh@cdelta.in" class="btn btn-email">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Send Email
            </a>
        </div>
        
        <div class="branding">
            Powered by <span>Cdelta</span>
        </div>
    </div>

</body>
</html>
