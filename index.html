<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constellation-Delta Group</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png">

<style>

:root{
--bg:#0b120d;
--bg2:#162019;
--gold:#d4af37;
--gold-light:#f0cf6b;
--text:#d6d6d6;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:
linear-gradient(
180deg,
#0b120d,
#142018,
#0b120d
);
color:var(--white);
font-family:Arial,sans-serif;
overflow-x:hidden;
}

.container{
width:min(1100px,90%);
margin:auto;
}

/* NAVBAR */

nav{
position:sticky;
top:0;
z-index:1000;
background:rgba(10,15,12,.85);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(212,175,55,.12);
}

.nav-inner{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}

.nav-logo{
display:flex;
align-items:center;
gap:12px;
}

.nav-logo img{
height:54px;
}

.nav-links{
display:flex;
gap:30px;
}

.nav-links a{
color:var(--gold);
text-decoration:none;
font-weight:600;
}

/* HERO */

.hero{
padding:70px 0 40px;
text-align:center;
}

.hero-logo{
width:140px;
margin:auto;
display:block;
}

.company-name{
font-family:Georgia,serif;
font-size:58px;
font-weight:700;
color:var(--gold);
letter-spacing:2px;
margin-top:25px;
}

.company-group{
display:block;
font-size:26px;
letter-spacing:8px;
margin-top:8px;
}

.company-about{
max-width:800px;
margin:35px auto;
font-size:20px;
line-height:1.9;
color:var(--text);
}

.about-link{
display:inline-block;
color:var(--gold);
text-decoration:none;
font-size:18px;
font-weight:600;
margin-top:10px;
}

/* CARDS */

.verticals{
padding:40px 0;
}

.vertical-card{
background:rgba(255,255,255,.03);
border:1px solid rgba(212,175,55,.15);
border-radius:18px;
padding:28px;
margin-bottom:22px;
cursor:pointer;
transition:.3s;
backdrop-filter:blur(12px);
}

.vertical-card:hover{
border-color:var(--gold);
box-shadow:0 0 30px rgba(212,175,55,.15);
}

.vertical-title{
font-size:32px;
font-family:Georgia,serif;
color:var(--gold);
}

.vertical-arrow{
float:right;
}

.vertical-content{
display:none;
padding-top:25px;
color:var(--text);
line-height:1.9;
font-size:18px;
}

.show{
display:block;
}

/* CONTACT */

.contact{
padding:60px 0;
}

.section-title{
text-align:center;
font-size:48px;
font-family:Georgia,serif;
color:var(--gold);
margin-bottom:35px;
}

.contact-box{
max-width:800px;
margin:auto;
background:rgba(255,255,255,.03);
border:1px solid rgba(212,175,55,.15);
padding:35px;
border-radius:20px;
}

input,
textarea{
width:100%;
padding:18px;
margin-bottom:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(212,175,55,.15);
border-radius:10px;
color:white;
font-size:17px;
}

textarea{
height:180px;
}

.submit-btn{
background:var(--gold);
color:black;
border:none;
padding:16px 35px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.company-name{
font-size:36px;
}

.company-group{
font-size:18px;
letter-spacing:4px;
}

.company-about{
font-size:17px;
}

.vertical-title{
font-size:24px;
}

.section-title{
font-size:34px;
}

.nav-links{
gap:15px;
font-size:14px;
}

}

</style>
</head>

<body>

<nav>
<div class="container nav-inner">

<div class="nav-logo">
<img src="assets/img/logo.png" alt="Logo">
</div>

<div class="nav-links">
<a href="about.html">About Us</a>
<a href="#contact">Contact Us</a>
</div>

</div>
</nav>

<section class="hero">

<div class="container">

<img src="assets/img/logo.png" class="hero-logo">

<h1 class="company-name">
CONSTELLATION-DELTA
<span class="company-group">GROUP</span>
</h1>

<p class="company-about">
Constellation-Delta Group is a multidisciplinary
business platform bringing together strategic
consulting, market linkage, and reputation
management solutions.
</p>

<a href="about.html" class="about-link">
About Constellation-Delta →
</a>

</div>

</section>

<section class="verticals">
<div class="container">
