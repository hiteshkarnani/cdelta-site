<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation-Delta Group</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1c2c;
    color: white;
    padding-top: 130px;
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: #0b1c2c;
    z-index: 1000;
    padding: 10px 40px;
}

/* BRAND BLOCK */
.brand-block {
    display: flex;
    flex-direction: column;
}

.main-logo {
    height: 90px;
}

.logo-text {
    height: 45px;
    margin-top: -12px;
}

/* HERO */
.hero img {
    width: 100%;
    max-height: 100vh;
    object-fit: contain;
}

/* SECTION */
.section {
    padding: 60px 20px;
    text-align: center;
}

/* SLIDESHOW */
.slider {
    position: relative;
    max-width: 900px;
    margin: auto;
}

.slide {
    display: none;
}

.slide img {
    width: 100%;
    height: auto;
    border-radius: 10px;
}

/* CONTACT FORM */
textarea {
    width: 80%;
    max-width: 500px;
    height: 120px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    resize: none;
}

button {
    margin-top: 10px;
    padding: 10px 25px;
    border: none;
    background: gold;
    color: black;
    border-radius: 5px;
    cursor: pointer;
}

/* ADDRESS */
.address {
    margin-top: 20px;
    line-height: 1.6;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="brand-block">
        <img src="assets/img/logo.png" class="main-logo">
        <img src="assets/img/logo-text.png" class="logo-text">
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <img src="assets/img/header-bg.jpg">
</section>

<!-- CORE VERTICALS -->
<section class="section">
    <h2>Our Core Verticals</h2>

    <div class="slider">
        <div class="slide">
            <img src="assets/img/delta-linkage.jpg">
        </div>

        <div class="slide">
            <img src="assets/img/delta-consultancies.jpg">
        </div>

        <div class="slide">
            <img src="assets/img/delta-pixels.jpg">
        </div>
    </div>
</section>

<!-- CONTACT -->
<section class="section">
    <h2>Contact Us</h2>

    <textarea maxlength="500" placeholder="Write your message (max 500 characters)"></textarea><br>
    <button>Send</button>

    <div class="address">
        <p><b>Sardarshahar Office</b><br>
        Maheshwari Marg, Near Taal Maidan,<br>
        Opp Satyanarayan Temple,<br>
        Near Tall, Sardarshahar, RJ 331403</p>

        <p><b>Jaipur Office</b><br>
        A02, D-Block, Behind WTP,<br>
        Mahesh Marg, Malviya Nagar,<br>
        Jaipur, Rajasthan 302017</p>
    </div>
</section>

<!-- SCRIPT -->
<script>
let slideIndex = 0;
showSlides();

function showSlides() {
    let slides = document.getElementsByClassName("slide");

    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }

    slideIndex++;
    if (slideIndex > slides.length) { slideIndex = 1 }

    slides[slideIndex - 1].style.display = "block";

    setTimeout(showSlides, 3000);
}
</script>

</body>
</html>
