<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation-Delta Group</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1c2c;
    color: white;
}

/* NAVBAR */
.navbar {
    background: #0b1c2c;
    padding: 5px 40px; /* reduced top gap */
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LOGO */
.brand img {
    height: 120px; /* increased size */
    width: auto;
}

/* NAV BUTTON */
.nav-btn {
    padding: 10px 20px;
    border: 1px solid gold;
    background: transparent;
    color: gold;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.nav-btn:hover {
    background: gold;
    color: black;
}

/* HERO */
.hero {
    text-align: center;
    margin-top: -10px; /* pulls content up */
}

.hero img {
    width: 95%;
    max-width: 1200px;
    height: auto;
    object-fit: contain;
}

/* SECTION */
.section {
    padding: 60px 20px;
    text-align: center;
}

/* SLIDER */
.slider {
    max-width: 900px;
    margin: auto;
}

.slide {
    display: none;
}

.slide img {
    width: 100%;
    height: auto;
    border-radius: 10px;
}

/* CONTACT */
textarea {
    width: 80%;
    max-width: 500px;
    height: 120px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    resize: none;
}

button {
    margin-top: 10px;
    padding: 10px 25px;
    border: none;
    background: gold;
    color: black;
    border-radius: 5px;
    cursor: pointer;
}

.address {
    margin-top: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="brand">
        <img src="assets/img/logo.png">
    </div>

    <button class="nav-btn">About Us</button>
</div>

<!-- HERO -->
<section class="hero">
    <img src="assets/img/header-bg.jpg">
</section>

<!-- CORE VERTICALS -->
<section class="section">
    <h2>Our Core Verticals</h2>

    <div class="slider">
        <div class="slide">
            <img src="assets/img/delta-linkage.jpg">
        </div>

        <div class="slide">
            <img src="assets/img/delta-consultancies.jpg">
        </div>

        <div class="slide">
            <img src="assets/img/delta-pixels.jpg">
        </div>
    </div>
</section>

<!-- CONTACT -->
<section class="section">
    <h2>Contact Us</h2>

    <textarea maxlength="500" placeholder="Write your message (max 500 characters)"></textarea><br>
    <button>Send</button>

    <div class="address">
        <p><b>Sardarshahar Office</b><br>
        Maheshwari Marg, Near Taal Maidan,<br>
        Opp Satyanarayan Temple,<br>
        Near Tall, Sardarshahar, RJ 331403</p>

        <p><b>Jaipur Office</b><br>
        A02, D-Block, Behind WTP,<br>
        Mahesh Marg, Malviya Nagar,<br>
        Jaipur, Rajasthan 302017</p>
    </div>
</section>

<!-- SLIDER SCRIPT -->
<script>
let slideIndex = 0;
showSlides();

function showSlides() {
    let slides = document.getElementsByClassName("slide");

    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }

    slideIndex++;
    if (slideIndex > slides.length) { slideIndex = 1 }

    slides[slideIndex - 1].style.display = "block";

    setTimeout(showSlides, 3000);
}
</script>

</body>
</html>
